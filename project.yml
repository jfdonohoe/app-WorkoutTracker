# XcodeGen spec — FALLBACK ONLY.
#
# A ready-to-open WorkoutTracker.xcodeproj is already committed in this folder.
# Just double-click it in Xcode 16+ and Run (Cmd-R).
#
# If the .xcodeproj ever fails to open on your machine, you can regenerate it:
#   brew install xcodegen
#   cd "Workout iOS App"
#   xcodegen generate
#
name: WorkoutTracker
options:
  bundleIdPrefix: com.ymca
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1          # iPhone only
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources:
      - WorkoutTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ymca.workouttracker
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
  WorkoutTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WorkoutTrackerTests
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ymca.workouttracker.tests
        GENERATE_INFOPLIST_FILE: "YES"
