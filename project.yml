# XcodeGen spec — FALLBACK ONLY.
#
# A ready-to-open WorkoutTracker.xcodeproj is already committed in this folder.
# Just double-click it in Xcode 16+ and Run (Cmd-R).
#
# If the .xcodeproj ever fails to open on your machine, you can regenerate it:
#   brew install xcodegen
#   cd "WorkoutApp"
#   xcodegen generate
#
# Keep this in step with the committed project: a regenerated project with a
# different bundle id installs as a separate app, and the user's workout
# store stays behind with the old one.
#
name: WorkoutTracker
options:
  bundleIdPrefix: com.donohoeux
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: 1          # iPhone only
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: 4
targets:
  WorkoutTracker:
    type: application
    platform: iOS
    sources:
      - WorkoutTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donohoeux.workouttracker
        DEVELOPMENT_TEAM: 5TQCUYQZVA
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Sets
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of an exercise or machine to attach to its definition."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose an exercise or machine photo from your library."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchBackdrop
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        # Theme.swift is light-only, so the app never shows Dark Mode.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
  WorkoutTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WorkoutTrackerTests
    dependencies:
      - target: WorkoutTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donohoeux.workouttracker.tests
        GENERATE_INFOPLIST_FILE: "YES"
